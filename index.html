<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Live Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
        
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --gold: #F9A825;
            --gold-dark: #F57F17;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #F9A825, #F57F17);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .lang-toggle {
            background: rgba(249, 168, 37, 0.15);
            color: #F9A825;
            border: 2px solid #F9A825;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .lang-toggle:hover {
            background: #F9A825;
            color: #1a1a2e;
            transform: scale(1.05);
        }
        
        .main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }
        
        @media (max-width: 992px) {
            .main {
                grid-template-columns: 1fr;
            }
        }
        
        .input-panel {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(249, 168, 37, 0.15);
        }
        
        .card-label {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        
        .card-value {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--gold);
            transition: all 0.4s ease;
        }
        
        .today-earnings {
            background: linear-gradient(145deg, #16213e, #1e2a4d);
            border: 3px solid #F9A825;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 0 40px rgba(249, 168, 37, 0.3);
        }
        
        .today-label {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 10px;
        }
        
        .today-amount {
            font-size: 3.2rem;
            font-weight: 800;
            color: #F9A825;
            text-shadow: 0 0 25px #F9A825,
                         0 0 40px #F57F17;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .progress-container {
            margin-top: 20px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            height: 12px;
            background: #334155;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F9A825, #F57F17);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 9999px;
        }
        
        .inputs {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 500;
            color: #ccc;
        }
        
        input {
            padding: 14px 16px;
            background: #0f1629;
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            transition: border 0.3s;
        }
        
        input:focus {
            border-color: #F9A825;
            outline: none;
        }
        
        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .adsense {
            margin: 30px auto;
            max-width: 728px;
            height: 90px;
            background: rgba(255,255,255,0.05);
            border: 2px dashed #555;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.9rem;
        }
        
        .unit {
            font-size: 0.95rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title" id="page-title">Salary Live Counter</div>
            <button class="lang-toggle" id="lang-btn">
                🌐 <span id="lang-text">中文</span>
            </button>
        </header>

        <div class="main">
            <!-- Input Panel -->
            <div class="input-panel">
                <div class="inputs">
                    <div class="input-group">
                        <label id="monthly-label">Monthly Salary</label>
                        <div style="position: relative;">
                            <span style="position: absolute; left: 16px; top: 14px; color: #F9A825; font-weight: bold;" id="currency-symbol">$</span>
                            <input type="number" id="monthly-salary" value="12000" style="padding-left: 50px; width: 100%;">
                        </div>
                    </div>
                    
                    <div class="time-inputs">
                        <div class="input-group">
                            <label id="start-label">Start Time</label>
                            <input type="time" id="start-time" value="09:00">
                        </div>
                        <div class="input-group">
                            <label id="end-label">End Time</label>
                            <input type="time" id="end-time" value="18:00">
                        </div>
                    </div>
                </div>

                <div style="margin-top: 35px;">
                    <div class="today-earnings">
                        <div class="today-label" id="today-label">Today's Earnings</div>
                        <div class="today-amount" id="today-amount">$0.00</div>
                        <div class="progress-container">
                            <div class="progress-label">
                                <span id="progress-text">Work Progress</span>
                                <span id="progress-percent">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div>
                <div class="stats-grid">
                    <!-- Daily -->
                    <div class="card">
                        <div class="card-label" id="daily-label">Daily</div>
                        <div class="card-value" id="daily-value">$400.00</div>
                        <div class="unit" id="daily-unit">¥/day</div>
                    </div>
                    
                    <!-- Hourly -->
                    <div class="card">
                        <div class="card-label" id="hourly-label">Hourly</div>
                        <div class="card-value" id="hourly-value">$50.00</div>
                        <div class="unit" id="hourly-unit">¥/hr</div>
                    </div>
                    
                    <!-- Per Minute -->
                    <div class="card">
                        <div class="card-label" id="minute-label">Per Minute</div>
                        <div class="card-value" id="minute-value">$0.83</div>
                        <div class="unit" id="minute-unit">¥/min</div>
                    </div>
                    
                    <!-- Per Second -->
                    <div class="card">
                        <div class="card-label" id="second-label">Per Second</div>
                        <div class="card-value" id="second-value">$0.014</div>
                        <div class="unit" id="second-unit">¥/sec</div>
                    </div>
                </div>

                <div style="margin-top: 25px; background: var(--card); border-radius: 16px; padding: 20px; font-size: 0.95rem; color: #bbb;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;" id="work-hours-row">
                        <span id="work-hours-label">Working hours per day:</span>
                        <span id="work-hours-value">9.0 hours</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;" id="days-month-row">
                        <span id="days-month-label">Assuming 30 days/month</span>
                        <span>30</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad placeholder -->
        <div class="adsense">
            Google AdSense Placeholder
        </div>

        <footer>
            <p>Real-time salary calculator • Updates every second</p>
        </footer>
    </div>

    <script>
        // Language data
        const translations = {
            en: {
                pageTitle: "Salary Live Counter",
                langText: "中文",
                monthlyLabel: "Monthly Salary",
                startLabel: "Start Time",
                endLabel: "End Time",
                todayLabel: "Today's Earnings",
                progressText: "Work Progress",
                dailyLabel: "Daily",
                hourlyLabel: "Hourly",
                minuteLabel: "Per Minute",
                secondLabel: "Per Second",
                dailyUnit: "$/day",
                hourlyUnit: "$/hr",
                minuteUnit: "$/min",
                secondUnit: "$/sec",
                workHoursLabel: "Working hours per day:",
                daysMonthLabel: "Assuming 30 days/month"
            },
            zh: {
                pageTitle: "工资实时计算器",
                langText: "English",
                monthlyLabel: "月薪",
                startLabel: "上班时间",
                endLabel: "下班时间",
                todayLabel: "今日已赚",
                progressText: "今日工作进度",
                dailyLabel: "日薪",
                hourlyLabel: "时薪",
                minuteLabel: "每分钟",
                secondLabel: "每秒",
                dailyUnit: "元/天",
                hourlyUnit: "元/小时",
                minuteUnit: "元/分钟",
                secondUnit: "元/秒",
                workHoursLabel: "每日工作时长：",
                daysMonthLabel: "按每月30天计算"
            }
        };

        let currentLang = 'en';
        let monthlySalary = 12000;
        let startHour = 9;
        let startMinute = 0;
        let endHour = 18;
        let endMinute = 0;
        let currency = '$';

        // DOM elements
        const monthlyInput = document.getElementById('monthly-salary');
        const startTimeInput = document.getElementById('start-time');
        const endTimeInput = document.getElementById('end-time');
        const langBtn = document.getElementById('lang-btn');
        const langText = document.getElementById('lang-text');

        // Update language
        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('page-title').textContent = t.pageTitle;
            langText.textContent = t.langText;
            
            document.getElementById('monthly-label').textContent = t.monthlyLabel;
            document.getElementById('start-label').textContent = t.startLabel;
            document.getElementById('end-label').textContent = t.endLabel;
            document.getElementById('today-label').textContent = t.todayLabel;
            document.getElementById('progress-text').textContent = t.progressText;
            
            document.getElementById('daily-label').textContent = t.dailyLabel;
            document.getElementById('hourly-label').textContent = t.hourlyLabel;
            document.getElementById('minute-label').textContent = t.minuteLabel;
            document.getElementById('second-label').textContent = t.secondLabel;
            
            // Units will be updated in render function
            document.getElementById('work-hours-label').textContent = t.workHoursLabel;
            document.getElementById('days-month-label').textContent = t.daysMonthLabel;
        }

        // Parse time
        function parseTime(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return { hour: h, minute: m };
        }

        // Calculate rates
        function calculateRates() {
            monthlySalary = parseFloat(monthlyInput.value) || 12000;
            
            const start = parseTime(startTimeInput.value);
            const end = parseTime(endTimeInput.value);
            
            startHour = start.hour;
            startMinute = start.minute;
            endHour = end.hour;
            endMinute = end.minute;
            
            const workMinutes = (endHour * 60 + endMinute) - (startHour * 60 + startMinute);
            const workHours = Math.max(workMinutes / 60, 0.5);
            
            // Daily salary (30 days)
            const daily = monthlySalary / 30;
            const hourly = daily / workHours;
            const perMinute = hourly / 60;
            const perSecond = perMinute / 60;
            
            return {
                daily: daily,
                hourly: hourly,
                perMinute: perMinute,
                perSecond: perSecond,
                workHours: workHours
            };
        }

        // Format number with commas and 2 decimals
        function formatMoney(num) {
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Get today's earnings
        function getTodayEarnings(rates) {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTotalMinutes = currentHour * 60 + currentMinute;
            
            const startTotalMinutes = startHour * 60 + startMinute;
            const endTotalMinutes = endHour * 60 + endMinute;
            
            let elapsedMinutes = 0;
            
            if (currentTotalMinutes > startTotalMinutes && currentTotalMinutes < endTotalMinutes) {
                elapsedMinutes = currentTotalMinutes - startTotalMinutes;
            } else if (currentTotalMinutes >= endTotalMinutes) {
                elapsedMinutes = endTotalMinutes - startTotalMinutes; // finished
            }
            
            const earnings = elapsedMinutes * rates.perMinute;
            const progress = Math.min(Math.max((elapsedMinutes / (rates.workHours * 60)) * 100, 0), 100);
            
            return { earnings, progress };
        }

        // Main render function
        function updateDisplay() {
            const rates = calculateRates();
            const today = getTodayEarnings(rates);
            
            // Update cards
            document.getElementById('daily-value').textContent = currency + formatMoney(rates.daily);
            document.getElementById('hourly-value').textContent = currency + formatMoney(rates.hourly);
            document.getElementById('minute-value').textContent = currency + formatMoney(rates.perMinute);
            document.getElementById('second-value').textContent = currency + formatMoney(rates.perSecond);
            
            // Update today
            document.getElementById('today-amount').textContent = currency + formatMoney(today.earnings);
            
            // Progress
            document.getElementById('progress-fill').style.width = today.progress + '%';
            document.getElementById('progress-percent').textContent = Math.round(today.progress) + '%';
            
            // Work hours
            document.getElementById('work-hours-value').textContent = rates.workHours.toFixed(1) + ' hours';
            
            // Update units based on language
            const isZh = currentLang === 'zh';
            document.getElementById('daily-unit').textContent = isZh ? '元/天' : '$/day';
            document.getElementById('hourly-unit').textContent = isZh ? '元/小时' : '$/hr';
            document.getElementById('minute-unit').textContent = isZh ? '元/分钟' : '$/min';
            document.getElementById('second-unit').textContent = isZh ? '元/秒' : '$/sec';
        }

        // Real-time loop
        function startLiveCounter() {
            updateDisplay();
            setInterval(() => {
                updateDisplay();
            }, 1000);
        }

        // Event listeners
        function initListeners() {
            monthlyInput.addEventListener('input', updateDisplay);
            startTimeInput.addEventListener('change', updateDisplay);
            endTimeInput.addEventListener('change', updateDisplay);
            
            langBtn.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'zh' : 'en';
                currency = newLang === 'zh' ? '¥' : '$';
                document.getElementById('currency-symbol').textContent = currency;
                updateLanguage(newLang);
                updateDisplay();
            });
            
            // Keyboard support for number input
            monthlyInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') updateDisplay();
            });
        }

        // Initialize
        function init() {
            // Set initial currency
            document.getElementById('currency-symbol').textContent = currency;
            
            updateLanguage('en');
            initListeners();
            startLiveCounter();
            
            // Initial render
            setTimeout(updateDisplay, 300);
        }

        window.onload = init;
    </script>
</body>
</html>
